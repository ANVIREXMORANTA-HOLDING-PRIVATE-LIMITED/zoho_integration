name: Python checks
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q zoho_integration
      - run: python - <<'PY'
import json
from pathlib import Path
for p in Path("zoho_integration").rglob("*.json"):
    json.loads(p.read_text())
print("JSON files valid")
PY
