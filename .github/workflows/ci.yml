name: Python checks
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q zoho_integration
      - run: python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('zoho_integration').rglob('*.json')]; print('JSON files valid')"
